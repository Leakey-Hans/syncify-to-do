<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syncify</title>
</head>
<body>
    <main class="main-container">
        <aside class="side-bar">
            <div class="logo">Syncify</div>
            <ul class="list-items">
                <li class="list-item active">All Projects</li>
                <li class="list-item">Pending</li>
                <li class="list-item">Completed</li>
                <li class="list-item">Team</li>
            </ul>
            <button type="button" class="project-button">+ New Project</button>
        </aside>
        <div class="content-area">
            <div class="user-name">Hey Lee,</div>
            <div class="announcements">You got 8 tasks today</div>
            <form action="" class="searchbar">
                <input type="text" placeholder="Search Projects..">
            </form>
            <div class="title"><h2>Projects</h2></div>
            <div class="project-section">
                <div class="project-card" title="Project">
                    <div class="project-header">
                        <div class="project-title">Appointments</div>
                        <button type="button" class="project-btn add">Add To-do</button>
                        <button type="button" class="project-btn del">Delete Project</button>
                    </div>
                    <div class="to-dos">
                        <div class="to-do">
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="project-modal">
            <form action="" class="modal-form">
                    <div>Enter Project Title</div>
                    <input type="text" required maxlength="20" class="project-name">
                    <button type="button" class="add-project">Add Project</button>
            </form>
        </div>
    </main>
</body>
</html>
