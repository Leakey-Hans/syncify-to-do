<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syncify</title>
</head>
<body>
    <main class="main-container">
        <aside class="side-bar">
            <div class="logo">Syncify</div>
            <ul class="list-items">
                <li class="list-item active">All Projects</li>
                <li class="list-item">Pending</li>
                <li class="list-item">Completed</li>
                <li class="list-item">Team</li>
            </ul>
            <button type="button" class="project-button">+ New Project</button>
        </aside>
        <div class="content-area">
            <div class="user-name">Hey Lee,</div>
            <div class="announcements">You got 8 tasks today - to be done by JS</div>
            <form action="" class="searchbar">
                <input type="text" placeholder="Search Projects..">
            </form>
            <div class="title"><h2>Projects</h2></div>
            <div class="project-section">
                <div class="project-card">
                    <div class="project-header">
                        <div class="project-title">Appointments</div>
                        <button type="button" class="project-btn add">Add To-do</button>
                        <button type="button" class="project-btn del">Delete Project</button>
                    </div>
                    <div class="to-dos">
                        <div class="to-do one">
                            <p class="meta-item toDoDesc">visit ma in hospital</p>
                            <div class="meta-item toDoPriority">Priority: <span class="span-item priority">low</span></div>
                            <div class="meta-item toDoDueDate">Due: <span class="span-item dueDate">dd/mm/yyyy</span></div>
                        </div>
                        <div class="to-do two">
                            <p class="meta-item toDoDesc">Run Errands to Town</p>
                            <div class="meta-item toDoPriority">Priority: <span class="span-item priority">high</span></div>
                            <div class="meta-item toDoDueDate">Due: <span class="span-item dueDate">dd/mm/yyyy</span></div>
                        </div>
                        <div class="to-do last">
                            <p class="meta-item toDoDesc">Ruto must go</p>
                            <div class="meta-item toDoPriority">Priority: <span class="span-item priority">medium</span></div>
                            <div class="meta-item toDoDueDate">Due: <span class="span-item dueDate">dd/mm/yyy</span></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
